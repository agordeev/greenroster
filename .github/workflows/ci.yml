name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: http://127.0.0.1:3000
      SUPPORT_EMAIL: support@greenroster.test
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      SUPABASE_SECRET_KEY: sb_secret_ci_only
      INVITATION_TOKEN_SECRET: ci-only-synthetic-invitation-token-secret
      INVITATION_TTL_HOURS: 48
      RESEND_API_KEY: re_ci_only_synthetic
      RESEND_FROM_EMAIL: notifications@greenroster.test
      RESEND_WEBHOOK_SECRET: whsec_ci_only_synthetic
      CRON_SECRET: ci-only-synthetic-notification-cron-secret
      NOTIFICATION_EMAIL_MAX_ATTEMPTS: 3
      NOTIFICATION_EMAIL_RETRY_SECONDS: 300
      EXPO_PUBLIC_APP_URL: http://127.0.0.1:3000
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm db:start
      - run: pnpm db:reset
      - run: pnpm db:test
